[project]
name = "my-project"
version = "0.1.0"
description = "Telegram bot / your project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

# Опционально: если хотите запускать бота одной командой `uv run mybot`
[project.scripts]
mybot = "my_project.main:main"  # Убедитесь, что в main.py есть def main():

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
]

# УДАЛИТЕ [tool.uv.workspace] полностью!
